[package]
name        = "harvest_pay"
version     = "0.1.0"
edition     = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level        = "z"
overflow-checks  = true
debug            = false
debug-assertions = false
codegen-units    = 1
lto              = true
panic            = "abort"
